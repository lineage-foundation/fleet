name: Build and push node images

# Builds the slim per-node images and pushes them to the GitHub Container
# Registry (GHCR): ghcr.io/<owner>/fleet-<node>. Each image is a single Docker
# stage/target of the multi-target Dockerfile. Runs on a published Release
# (tagged with the release version + `latest`) and on pushes to main (tagged
# `main` + the commit sha) so deployments can pin an image by reference.

on:
  release:
    types: [published]
  push:
    branches: [main]

jobs:
  build-push:
    name: ${{ matrix.node }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        node: [mempool, storage, miner]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fleet-${{ matrix.node }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.node }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fleet-${{ matrix.node }}
          cache-to: type=gha,mode=max,scope=fleet-${{ matrix.node }}
