name: Deploy testnet (canary)

# Guarded canary deploy of a signed release onto the live 9-service testnet (Railway
# project "fleet", environment "testnet"). Rolls vX.Y.Z one node at a time — miner-2 as the
# canary, then the rest of the miners, then storage one-by-one, then mempool one-by-one —
# verifying chain health between every step and auto-rolling-back on regress. See
# ops/deploy-testnet.sh for the full flow, the health check (identical consensus hash across
# storage-0/1/2, not just matching heights), and the structural testnet-only guard.
#
# Ordering: this runs AFTER the image-build workflow ("Build, scan and push node images")
# COMPLETES for a release, via `workflow_run` — not directly on `release: published`. That
# guarantees the signed vX.Y.Z images actually exist before the canary tries to cosign-verify
# and deploy them (triggering on the release directly would race the ~10-min image build and
# abort on a missing/unsigned image). The job below only proceeds when that upstream run was
# for a release AND succeeded; ordinary main-push image builds do not deploy. `workflow_dispatch`
# remains for manual/dry-run deploys of a specific version.
#
# Required secret: RAILWAY_API_TOKEN — a Railway API token scoped to the fleet project, added
# as a fleet repo (or "testnet" environment) Actions secret. Nothing else is required; every
# project/environment/service ID it needs is resolved from the Railway API at runtime (see
# ops/deploy-testnet.sh) rather than stored here.

on:
  workflow_run:
    workflows: ["Build, scan and push node images"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to deploy, e.g. v1.4.2 (GHCR image tag is this without the leading v)"
        required: true
        type: string
      dry_run:
        description: "Resolve and print the deploy plan only; make zero mutations"
        required: false
        type: boolean
        default: false

concurrency:
  # One canary rollout at a time; never let two runs race mutations onto the same testnet.
  group: deploy-testnet
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-testnet:
    name: Canary deploy testnet
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: testnet
    # Proceed only for a manual dispatch, or when the upstream image build ran for a
    # RELEASE and succeeded. This filters out the image builds that run on ordinary
    # pushes to main (workflow_run fires for those too) so only releases deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'release' && github.event.workflow_run.conclusion == 'success')
    env:
      # For a release-triggered image build, workflow_run.head_branch is the release tag
      # (e.g. v0.1.1); the deploy script normalizes the leading v to the bare GHCR tag.
      VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.event.workflow_run.head_branch }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: "v2.4.1"

      - name: Run guarded canary deploy
        run: ops/deploy-testnet.sh "$VERSION"
