# SAST. Blocking: fails on any finding from the configured rulesets, tune via
# .semgrepignore or by narrowing the --config list below.
#
# Note: Semgrep's Rust support is limited compared to its JS/Python/Go coverage, so this is
# a real but partial net for the Rust workspace here — it's strongest on scripts, config,
# and generic secret patterns (p/secrets), not full Rust dataflow analysis. Complements,
# does not replace, cargo-audit/RUSTSEC-driven checks already covered by Trivy.
#
# One p/default rule (github-actions-mutable-action-tag) is excluded: every workflow in
# this repo, including the pre-existing ones, deliberately pins actions to a mutable major
# tag (e.g. actions/checkout@v4) rather than a commit SHA. Rewriting that convention is a
# separate, repo-wide hardening decision, out of scope here. Revisit by dropping the
# --exclude-rule flag once/if that convention changes.
name: Semgrep

# PR-only: this scan is a required status check for merging to main, so every
# change is scanned before it lands. Re-running on push to main would just rescan
# identical, already-gated content. workflow_dispatch allows an on-demand run.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Installed via pip rather than run in the semgrep/semgrep container image: that
      # image is Alpine/musl-based and has no Node.js, which actions/checkout and
      # upload-sarif below both need when a job runs inside a container.
      #
      # setuptools<81 is pinned because opentelemetry-instrumentation (a Semgrep
      # dependency) imports pkg_resources at runtime without pinning it itself, and
      # setuptools 81+ dropped pkg_resources — an unpinned install breaks on import.
      - name: Install Semgrep
        run: pip install "setuptools<81" semgrep==1.90.0

      - name: Run Semgrep
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan \
            --config p/default \
            --config p/secrets \
            --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag \
            --sarif --output semgrep.sarif \
            --error

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
