# Trivy: repository filesystem scan (vuln + misconfiguration).
# Container images are built and scanned in the images workflow (images.yml) as part of the
# build, so they are not rebuilt here. Fails on CRITICAL or HIGH findings (see `.trivyignore`
# for justified exceptions).
name: Trivy

# Runs on EVERY pull request (no path filter) so it can be a required status check for
# merging to main — a required check that is skipped on some PRs would leave them stuck
# "waiting". The fs scan is fast, so scanning every PR is a cheap, uniform merge gate.
# PR-only: this scan is a required status check for merging to main, so every
# change is scanned before it lands. Re-running on push to main would just rescan
# identical, already-gated content. workflow_dispatch allows an on-demand run.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: trivy-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Opt into Node.js 24 for JS actions ahead of GHES runner defaults (checkout, docker helpers, third-party actions).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TRIVY_SEVERITY: CRITICAL,HIGH

jobs:
  trivy-repo:
    name: Trivy filesystem (repo)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy (FS — vuln, misconfiguration)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: ${{ env.TRIVY_SEVERITY }}
          exit-code: "1"
          scanners: vuln,misconfig
          trivyignores: .trivyignore
          skip-dirs: target,.git,run,tasks,crates/fleet/src/db/db,crates/fleet/src/wallet/wallet,crates/fleet/src/bin/tls_data
          # Same PEM-in-JSON fixtures as image; not exercised in current deployments.
          skip-files: crates/fleet/src/bin/tls_certificates.json,.docker/conf/tls_certificates.json
