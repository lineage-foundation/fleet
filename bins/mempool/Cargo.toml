[package]
name = "mempool"
version = "1.1.2"
edition = "2021"

[[bin]]
name = "mempool"
path = "src/main.rs"

[dependencies]
fleet-mempool = { path = "../../crates/fleet-mempool" }
fleet-api = { path = "../../crates/fleet-api" }
fleet-core = { path = "../../crates/fleet-core" }
clap = "2.33.0"
config = { version = "0.14", default-features = false, features = ["toml", "json"] }
tokio = { version = "1.7.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.40"
tracing-subscriber = "0.2.3"
warp = { version = "0.3.7", features = ["tls"] }
