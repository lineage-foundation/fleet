[package]
name = "fleet-api"
version = "1.1.2"
edition = "2021"

[dependencies]
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
bincode = "1.2.1"
fleet-core = { path = "../fleet-core" }
fleet-wallet = { path = "../fleet-wallet" }
hex = "0.4.2"
serde = { version = "1.0.104", features = ["derive"] }
# preserve_order: keep struct field declaration order through `serde_json::to_value`
# in the /v1 handlers, so responses (e.g. OutPoint `{t_hash, n}`) match prime's
# canonical serialization. Clients sign "what they see" (JSON.stringify of the
# server response), so alphabetically reordered keys would break signature checks.
serde_json = { version = "1.0.61", features = ["preserve_order"] }
tokio = { version = "1.7.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.40"
prime = { path = "../prime" }
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

[dev-dependencies]
fleet-storage = { path = "../fleet-storage" }
fleet-user = { path = "../fleet-user" }
http-body-util = "0.1"
tower = "0.5.3"
