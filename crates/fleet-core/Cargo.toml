[package]
name = "fleet-core"
version = "1.1.2"
authors = ["Lineage Team <info@lineage.foundation>"]
edition = "2021"
description = "Lineage network core: shared consensus, comms, and mining primitives."

[dependencies]
ahash = "0.8.11"
async-trait = "0.1.58"
async-stream = "0.3.2"
bincode = "1.2.1"
bytes = { version = "1.0.1", features = ["serde"] }
chrono = "0.4.10"
config = { version = "0.14", default-features = false, features = ["toml", "json"] }
crevice = { version = "0.16.0", optional = true }
debug-ignore = { version = "1.0.5", optional = true }
futures = "0.3"
futures-util = "0.3.15"
gl = { version = "0.14.0", optional = true }
glfw = { version = "0.57.0", optional = true }
hex = "0.4.2"
merkletree = "0.23.0"
merkle-log = "0.0.3"
moka = { version = "0.12", features = ["future"] }
tw_chain = "1.1.3"
keccak_prime = "0.1.0"
protobuf = "2.6.0"
raft = { git = "https://github.com/ABlockOfficial/raft-rs", branch = "0.5.1" }
rand = "0.7.3"
# tracing-subscriber's EnvFilter uses `(?i:...)` in its directive regex; unify `regex` with unicode-case.
regex = { version = "1.10", features = ["unicode-case"] }
ring = "0.16.20"
rocksdb = "0.21.0"
rug = "1.7.0"
serde = { version = "1.0.104", features = ["derive"] }
sha3 = "0.9.1"
serde_json = "1.0.61"
tokio = { version = "1.7.1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-rustls = "0.23.0"
tokio-util = { version = "0.6.7", features = ["codec"] }
tokio-stream = "0.1.6"
tracing = { version = "0.1.40", features = ["log"] }
tracing-subscriber = "0.2.3"
tracing-futures = "0.2.3"
url = "2.4.1"
vulkano = { version = "0.34.0", optional = true }
vulkano-shaders = { version = "0.34.0", optional = true }
trust-dns-resolver = "0.23.2"
rustls-pemfile = "2.0.0"

[features]
mock = []
gpu = ["dep:crevice", "dep:debug-ignore", "dep:gl", "dep:glfw", "dep:vulkano", "dep:vulkano-shaders"]
# The miner benchmarks construct OpenGL/Vulkan miners, so they require the GPU backends.
benchmark_miners = ["gpu"]
