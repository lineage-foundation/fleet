# Gitleaks configuration. Extends the built-in default ruleset (do not disable it);
# add path/regex entries below only for justified, reviewed exceptions.
title = "fleet gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Known synthetic test/placeholder fixtures, not live secrets. Path regexes are unanchored to a directory prefix because gitleaks walks full git history, and these files have lived at more than one path over time."
regexes = []
paths = [
  # Autogenerated dummy CA/leaf TLS certs used only by comms_handler unit tests.
  '''(^|/)comms_handler/test_tls_certificates\.rs$''',
  # Placeholder TLS certificate/key bundle baked into node images; not used for TLS
  # on the current deployment path. Same fixture already excluded from Trivy (see
  # .trivyignore comment and trivy.yml / images.yml skip-files).
  '''(^|/)tls_certificates(_none)?\.json$''',
  # Deterministic, test-only wallet key/address fixtures for upgrade-path unit tests.
  '''(^|/)upgrade/tests\.rs$''',
]
